<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>쉐브론 전층 뷰어</title>
<meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="lib/pannellum.css"><script src="lib/pannellum.js"></script>
<style>html,body{margin:0;height:100%;background:#000;color:#fff;font-family:sans-serif}
#top{position:absolute;top:0;left:0;right:0;height:44px;background:#111;display:flex;gap:4px;align-items:center;padding:0 8px;overflow-x:auto;z-index:5}
#fls{display:flex;gap:4px;flex-wrap:nowrap}#top b{margin-right:8px;white-space:nowrap}.fl{padding:5px 10px;border-radius:4px;background:#333;cursor:pointer;white-space:nowrap}.fl.on{background:#fc0;color:#000}.fl.d{border:1px dashed #f66}
#p{position:absolute;top:44px;bottom:110px;left:0;right:0}
#strip{position:absolute;bottom:0;left:0;right:0;height:110px;background:#111;display:flex;gap:8px;align-items:center;padding:0 10px}
.th{cursor:pointer;border:3px solid transparent;border-radius:6px;position:relative;line-height:0}.th.on{border-color:#fc0}.th img{width:160px;height:80px}
.th span{position:absolute;left:4px;bottom:4px;line-height:1.4;font-size:12px;background:rgba(0,0,0,.65);padding:1px 5px}
#info{position:absolute;top:52px;left:44px;z-index:5;background:rgba(0,0,0,.65);padding:6px 10px;border-radius:4px;font-size:13px;max-width:70%}
#info .w{color:#f88;font-weight:bold}#help{margin-left:auto;font-size:12px;color:#aaa;white-space:nowrap}</style></head><body>
<div id="top"><b>쉐브론 전층 뷰어</b><span id="fls"></span><span id="help">← → 컷 이동 · ↑ ↓ 층 이동</span></div>
<div id="p"></div><div id="info"></div><div id="strip"></div>

, "cut": "C", "img": "img/7F_c.jpg", "thumb": "img/7F_c_t.jpg", "src": "/workspace/output/chevron_7f/final_v10/7F_c_final_8192.jpg", "ver": "final_v10", "draft": false}, {"id": "7F_d", "cut": "D", "img": "img/7F_d.jpg", "thumb": "img/7F_d_t.jpg", "src": "/workspace/output/chevron_7f/final_v10/7F_d_final_8192.jpg", "ver": "final_v10", "draft": false}]}, {"floor": "8F", "ko": "8층", "cuts": [{"id": "8F_a", "cut": "A", "img": "img/8F_a.jpg", "thumb": "img/8F_a_t.jpg", "src": "/workspace/output/chevron_8f/final_v9/8F_a_final_8192.jpg", "ver": "final_v9", "draft": false}, {"id": "8F_b", "cut": "B", "img": "img/8F_b.jpg", "thumb": "img/8F_b_t.jpg", "src": "/workspace/output/chevron_8f/final_v9/8F_b_final_8192.jpg", "ver": "final_v9", "draft": false}]}, {"floor": "RF", "ko": "옥상", "cuts": [{"id": "RF_a", "cut": "A", "img": "img/RF_a.jpg", "thumb": "img/RF_a_t.jpg", "src": "/workspace/output/chevron_rf/final_v9/RF_a_final_8192.jpg", "ver": "final_v9 (v9b)", "draft": false}, {"id": "RF_b", "cut": "B", "img": "img/RF_b.jpg", "thumb": "img/RF_b_t.jpg", "src": "/workspace/output/chevron_rf/final_v9/RF_b_final_8192.jpg", "ver": "final_v9", "draft": false}]}],L=[];D.forEach(function(f,fi){f.cuts.forEach(function(c,ci){L.push([fi,ci])})});
var v=null;function ld(id,cb){if(window.P&&P[id])return cb();var s=document.createElement('script');s.src='img/'+id+'.js';s.onload=cb;document.head.appendChild(s)}
var cf=0,cc=0;
document.getElementById('fls').innerHTML=D.map(function(f,i){return '<span class="fl'+(f.cuts[0].draft?' d':'')+'" data-i="'+i+'">'+f.floor+' '+f.ko+'</span>'}).join(' ');
document.querySelectorAll('.fl').forEach(function(e){e.onclick=function(){go(+e.dataset.i,0)}});
function go(f,c){cf=f;cc=c;var fl=D[f],x=fl.cuts[c];
 ld(x.id,function(){if(!v){var sc={};sc[x.id]={type:'equirectangular',panorama:P[x.id],hfov:100};v=pannellum.viewer('p',{default:{firstScene:x.id,autoLoad:true,sceneFadeDuration:300},scenes:sc})}else if(v.getScene()!==x.id){v.addScene(x.id,{type:'equirectangular',panorama:P[x.id],hfov:100});v.loadScene(x.id,'same','same','same')}});
 document.querySelectorAll('.fl').forEach(function(e,i){e.classList.toggle('on',i==f)});
 document.getElementById('strip').innerHTML=fl.cuts.map(function(k,i){return '<div class="th'+(i==c?' on':'')+'" data-c="'+i+'"><img src="'+k.thumb+'"><span>'+fl.floor+' '+k.cut+'컷</span></div>'}).join('');
 document.querySelectorAll('.th').forEach(function(e){e.onclick=function(){go(cf,+e.dataset.c)}});
 document.getElementById('info').innerHTML='<b>'+fl.floor+' ('+fl.ko+') · '+x.cut+'컷</b> — 버전: '+x.ver+(x.draft?' <span class="w">[미완료/초안]</span>':'')+'<br>원본: '+x.src;
 location.hash=x.id}
document.addEventListener('keydown',function(e){var i=L.findIndex(function(x){return x[0]==cf&&x[1]==cc});
 if(e.key=='ArrowRight'){i=(i+1)%L.length;go(L[i][0],L[i][1])}else if(e.key=='ArrowLeft'){i=(i-1+L.length)%L.length;go(L[i][0],L[i][1])}
 else if(e.key=='ArrowDown'){go((cf+1)%D.length,0)}else if(e.key=='ArrowUp'){go((cf-1+D.length)%D.length,0)}else return;e.preventDefault();e.stopPropagation()},true);
var h=location.hash.slice(1),s=L.find(function(x){return D[x[0]].cuts[x[1]].id==h});go(s?s[0]:0,s?s[1]:0);
